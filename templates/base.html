<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Academic Requisition{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<header class="top"><div class="in">
  <img src="{{ url_for('static', filename='logo.png') }}" alt="Institute logo">
  <div class="title">Student Academic Requisition System</div>
  <nav><a href="{{ url_for('index') }}">New Requisition</a><a href="{{ url_for('track') }}">Track Status</a><a href="{{ url_for('admin') }}">Admin</a></nav>
</div></header>
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></body></html>
